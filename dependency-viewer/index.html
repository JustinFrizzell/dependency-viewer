<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dependency viewer</title>
</head>
<body>
  <header><h1>Dependency viewer</h1><span>Entity dependency</span></header>
  <main>
    <div id="graph" role="img" aria-label="Directed entity dependency graph" aria-describedby="graph-summary"></div>
    <p id="status" role="status"></p>
    <p id="graph-filter-status" role="status"></p>
    <div id="graph-summary" class="visually-hidden"></div>
    <details id="entity-list" open hidden>
      <summary>Entities</summary>
      <div class="entity-list-content">
        <label for="entity-search">Search entities</label>
        <input id="entity-search" type="search" autocomplete="off" placeholder="Search full entity names">
        <p id="entity-search-status" role="status"></p>
        <ul id="entity-results"></ul>
      </div>
    </details>
    <details id="colour-settings" open hidden>
      <summary>Colours</summary>
      <div class="colour-settings-content">
        <div class="colour-settings-actions">
          <label><input id="colours-enabled" type="checkbox" checked> Colour entities</label>
          <button id="reset-colours" type="button">Reset</button>
        </div>
        <p>Colour entities when their full name contains this text. The first match wins.</p>
        <div id="colour-rules"></div>
      </div>
    </details>
    <div id="dependency-views" aria-label="Dependency view" hidden>
      <input id="graph-filter" type="search" aria-label="Filter graph by entity name" autocomplete="off" placeholder="Filter entity names">
      <button type="button" data-view="all" aria-pressed="true">All</button>
      <button type="button" data-view="connected" aria-pressed="false" disabled>Connected</button>
      <button type="button" data-view="upstream" aria-pressed="false" disabled>Upstream</button>
      <button type="button" data-view="downstream" aria-pressed="false" disabled>Downstream</button>
    </div>
    <div class="controls" aria-label="Graph navigation" hidden>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <output id="zoom-level" aria-label="Zoom level"></output>
      <button id="fit" type="button">Reset to fit</button>
      <button id="edge-motion" type="button">Pause</button>
    </div>
  </main>
  <footer>
    <details id="inspector" open>
      <summary>Entity details</summary>
      <div id="selection-status" aria-live="polite">No entity selected. Select an entity to inspect its details.</div>
    </details>
  </footer>
  <script id="dependency-data" type="application/json">__DEPENDENCY_DATA_JSON__</script>
</body>
</html>
